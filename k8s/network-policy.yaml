apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nestjs-api-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: nestjs-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          role: frontend
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
