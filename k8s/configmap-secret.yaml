apiVersion: v1
kind: ConfigMap
metadata:
  name: nestjs-config
  namespace: default
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  DB_SYNCHRONIZE: "false"
  DB_LOGGING: "false"
  CORS_ORIGIN: "https://example.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: nestjs-secrets
  namespace: default
type: Opaque
stringData:
  DB_HOST: postgres.default.svc.cluster.local
  DB_PORT: "5432"
  DB_USERNAME: postgres
  DB_PASSWORD: secure_password_here
  DB_NAME: nestjs_prod
  JWT_SECRET: your-super-secret-jwt-key-change-in-production
