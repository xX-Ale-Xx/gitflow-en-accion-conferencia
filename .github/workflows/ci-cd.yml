name: CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===== STAGE 1: Install & Lint =====
  install-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run format -- --check

  # ===== STAGE 2: Test =====
  test:
    needs: install-and-lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nestjs_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:cov
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: nestjs_test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

  # ===== STAGE 3: SonarQube Analysis =====
  sonarqube:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Download coverage reports
        uses: actions/download-artifact@v3

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          args: >
            -Dsonar.projectKey=nestjs-backend-mvc
            -Dsonar.organization=xx-ale-xx
            -Dsonar.sources=src
            -Dsonar.exclusions=**/*spec.ts,**/*dto.ts
            -Dsonar.coverage.exclusions=**/*spec.ts,src/main.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===== STAGE 4: Build =====
  build:
    needs: ["install-and-lint", "test", "sonarqube"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ===== STAGE 5: Infrastructure & Deploy (solo en develop y main) =====
  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v3

      # 1. Autenticación con GCP usando Workload Identity
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. Setup Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      # 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest

      # 4. Setup kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      # 5. Determinar ambiente y variables
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENVIRONMENT=production" >> $GITHUB_OUTPUT
            echo "NAMESPACE=production" >> $GITHUB_OUTPUT
            echo "TERRAFORM_ENV=production" >> $GITHUB_OUTPUT
            echo "CLUSTER_NAME=prod-gke-cluster" >> $GITHUB_OUTPUT
            echo "GCS_BUCKET=tfstate-${{ vars.GCP_PROJECT_ID }}-prod" >> $GITHUB_OUTPUT
          else
            echo "ENVIRONMENT=development" >> $GITHUB_OUTPUT
            echo "NAMESPACE=development" >> $GITHUB_OUTPUT
            echo "TERRAFORM_ENV=development" >> $GITHUB_OUTPUT
            echo "CLUSTER_NAME=dev-gke-cluster" >> $GITHUB_OUTPUT
            echo "GCS_BUCKET=tfstate-${{ vars.GCP_PROJECT_ID }}-dev" >> $GITHUB_OUTPUT
          fi

      # 6. Initializar Terraform
      - name: Terraform Init
        working-directory: terraform/environments/${{ steps.env.outputs.TERRAFORM_ENV }}
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.env.outputs.GCS_BUCKET }}" \
            -backend-config="prefix=nestjs-backend/${{ steps.env.outputs.TERRAFORM_ENV }}" \
            -upgrade

      # 7. Validar Terraform
      - name: Terraform Validate
        working-directory: terraform/environments/${{ steps.env.outputs.TERRAFORM_ENV }}
        run: terraform validate

      # 8. Planificar cambios (comment en PR)
      - name: Terraform Plan
        working-directory: terraform/environments/${{ steps.env.outputs.TERRAFORM_ENV }}
        run: |
          terraform plan \
            -var="gcp_project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="docker_image=ghcr.io/${{ github.repository }}:${{ github.sha }}" \
            -var="environment=${{ steps.env.outputs.ENVIRONMENT }}" \
            -out=tfplan

      # 9. Aplicar Terraform (crear/actualizar infraestructura)
      - name: Terraform Apply
        working-directory: terraform/environments/${{ steps.env.outputs.TERRAFORM_ENV }}
        run: |
          terraform apply -auto-approve tfplan

      # 10. Obtener outputs de Terraform
      - name: Get Terraform Outputs
        id: tf-output
        working-directory: terraform/environments/${{ steps.env.outputs.TERRAFORM_ENV }}
        run: |
          CLUSTER_ENDPOINT=$(terraform output -raw cluster_endpoint 2>/dev/null || echo "")
          KUBECTL_SETUP=$(terraform output -raw configure_kubectl 2>/dev/null || echo "")
          echo "cluster_endpoint=$CLUSTER_ENDPOINT" >> $GITHUB_OUTPUT
          echo "kubectl_setup=$KUBECTL_SETUP" >> $GITHUB_OUTPUT

      # 11. Configurar kubectl con credenciales desde Terraform
      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials ${{ steps.env.outputs.CLUSTER_NAME }} \
            --region us-central1 \
            --project ${{ vars.GCP_PROJECT_ID }}

      # 12. Crear namespace
      - name: Create namespace
        run: |
          kubectl create namespace ${{ steps.env.outputs.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      # 13. Verificar estado del cluster
      - name: Verify cluster connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      # 14. Notificar deployment éxito
      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Despliegue completado exitosamente"
          echo "🌍 Entorno: ${{ steps.env.outputs.ENVIRONMENT }}"
          echo "📦 Imagen: ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "☸️ Cluster: ${{ steps.env.outputs.CLUSTER_NAME }}"
          echo "📍 Namespace: ${{ steps.env.outputs.NAMESPACE }}"

      # 15. Notificar fallo
      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Error en despliegue. Verificar logs anteriores."
          echo "📋 Para debuggear:"
          echo "  terraform -chdir=terraform/environments/${{ steps.env.outputs.TERRAFORM_ENV }} show"
          echo "  kubectl describe nodes"
          exit 1
